<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Bus — Admin</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; color: #211b16; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 2rem; }
    table { border-collapse: collapse; width: 100%; margin-top: .75rem; font-size: .85rem; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #e5ddd0; }
    th { background: #f6f1e9; }
    code { background: #f1e8da; padding: .1rem .3rem; border-radius: .25rem; }
    button { cursor: pointer; }
    .muted { color: #8a7f70; }
    .revoked { text-decoration: line-through; color: #8a7f70; }
  </style>
</head>
<body>
  <h1>Agent Bus admin</h1>
  <p class="muted">Tokens, topics, and cleanup. Log in again daily — admin sessions expire after 24h.</p>

  <h2>Tokens</h2>
  <table id="tokens">
    <thead><tr><th>id</th><th>user</th><th>email</th><th>admin</th><th>browser</th><th>created</th><th>expires</th><th>revoked</th><th></th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Topics</h2>
  <table id="topics">
    <thead><tr><th>id</th><th>name</th><th>status</th><th>owner</th><th>messages</th><th></th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    // All rendering uses textContent (never innerHTML): values come from Okta
    // claims and topic metadata.
    const $ = (sel) => document.querySelector(sel);

    function cell(row, value, cls) {
      const td = document.createElement("td");
      td.textContent = value == null ? "" : String(value);
      if (cls) td.className = cls;
      row.appendChild(td);
    }

    async function loadTokens() {
      const res = await fetch("/api/admin/tokens");
      if (!res.ok) return showError("tokens", res);
      const data = await res.json();
      const tbody = $("#tokens tbody");
      tbody.replaceChildren();
      for (const t of data.tokens) {
        const tr = document.createElement("tr");
        if (t.revoked_at) tr.className = "revoked";
        cell(tr, t.id);
        cell(tr, t.sub);
        cell(tr, t.email);
        cell(tr, t.admin ? "yes" : "");
        cell(tr, t.browser ? "yes" : "");
        cell(tr, fmt(t.created_at));
        cell(tr, fmt(t.expires_at));
        cell(tr, t.revoked_at ? fmt(t.revoked_at) : "");
        if (!t.revoked_at) {
          const td = document.createElement("td");
          const btn = document.createElement("button");
          btn.textContent = "revoke";
          btn.onclick = async () => {
            if (!confirm(`Revoke token ${t.id} (${t.email || t.sub})?`)) return;
            const r = await fetch(`/api/admin/tokens/${t.id}/revoke`, { method: "POST" });
            if (r.ok) loadTokens(); else alert("Revoke failed: " + r.status);
          };
          td.appendChild(btn);
          tr.appendChild(td);
        } else {
          tr.appendChild(document.createElement("td"));
        }
        tbody.appendChild(tr);
      }
    }

    async function loadTopics() {
      const res = await fetch("/api/topics?limit=200");
      if (!res.ok) return showError("topics", res);
      const data = await res.json();
      const tbody = $("#topics tbody");
      tbody.replaceChildren();
      for (const t of data.topics) {
        const tr = document.createElement("tr");
        cell(tr, t.topic_id);
        cell(tr, t.name);
        cell(tr, t.status);
        cell(tr, t.metadata && t.metadata._owner ? t.metadata._owner.split("|").pop() : "(unowned)");
        cell(tr, t.message_count);
        const td = document.createElement("td");
        const btn = document.createElement("button");
        btn.textContent = "delete";
        btn.onclick = async () => {
          if (!confirm(`Delete topic "${t.name}" (${t.topic_id}) and all its messages?`)) return;
          const r = await fetch(`/api/topics/${t.topic_id}`, { method: "DELETE" });
          if (r.ok) loadTopics(); else alert("Delete failed: " + r.status);
        };
        td.appendChild(btn);
        tr.appendChild(td);
        tbody.appendChild(tr);
      }
    }

    function fmt(ts) { return ts ? new Date(ts * 1000).toISOString().slice(0, 19) : ""; }

    function showError(what, res) {
      const tbody = $(`#${what} tbody`);
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 9;
      td.textContent = `Failed to load ${what} (HTTP ${res.status}). ${
        res.status === 403 ? "Log in via /auth/login?browser=1 with an admin account." : ""
      }`;
      tr.appendChild(td);
      tbody.replaceChildren(tr);
    }

    loadTokens();
    loadTopics();
  </script>
</body>
</html>
